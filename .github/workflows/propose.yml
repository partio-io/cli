name: Propose Features

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no issues created)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  propose:
    runs-on: github-runner-partio-minion-ai-01
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4


      - name: Install minions
        run: |
          go install github.com/partio-io/minions/cmd/minions@v0.0.14
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The proposer files each issue with minion-reviewed. It can run
      # before any review creates that label, and gh issue create --label
      # fails on a missing label. The colour and description match the
      # ones the review gives the label, so --force changes nothing.
      - name: Ensure the minion-reviewed label
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh label create minion-reviewed --repo "${{ github.repository }}" --color 0e8a16 --description "The proposal review has acted on this issue" --force

      - name: Run propose program
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ARGS="run .minions/programs/propose.md"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          minions $ARGS
