name: Run Minion

on:
  workflow_dispatch:
    inputs:
      program:
        description: "Program .md file path (e.g., .minions/programs/detect-hooks.md)"
        required: true
        type: string
      dry_run:
        description: "Dry run (prompt generation only)"
        required: false
        default: false
        type: boolean

  issues:
    types: [labeled]

  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-minion:
    # A comment starts a build only when the command opens it and a trusted
    # account wrote it. The repository is public, so anyone can comment, and
    # the build runs on the self-hosted runner with GH_PAT. The review posts
    # its own comments as the operator, so a quote of the command inside a
    # comment must not start a build either.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && (github.event.label.name == 'minion-ready' || github.event.label.name == 'minion-approved')) ||
      (github.event_name == 'issue_comment' &&
       startsWith(github.event.comment.body, '/minion build') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: github-runner-partio-minion-ai-01
    timeout-minutes: 180

    # The pattern partio-minions uses to find the slice-plan comment
    # (internal/slices/slices.go, planMarkerRe). Two steps below read it, and
    # a build that reads a different pattern than the runtime is a build that
    # researches a planned issue, or builds an unplanned one.
    #
    # The review session writes its verdict to MINION_REVIEW_DIR. It runs in
    # an isolated minions worktree, so the path is absolute, in this
    # workspace, where the gate step finds it.
    env:
      MINION_REVIEW_DIR: ${{ github.workspace }}/.minion-review
      SLICE_PLAN_MARKER: '^[[:space:]]*<!--[[:space:]]*minion:research-slices([[:space:]][^>]*)?-->[[:space:]]*$'

    steps:
      - uses: actions/checkout@v4

      - name: Determine program
        id: program
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.program }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "issue_num=" >> "$GITHUB_OUTPUT"
          else
            ISSUE_NUM="${{ github.event.issue.number }}"
            echo "path=.minions/programs/implement.md" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "issue_num=${ISSUE_NUM}" >> "$GITHUB_OUTPUT"
          fi


      - name: Install minions
        run: |
          go install github.com/partio-io/minions/cmd/minions@v0.0.14
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The issue is reviewed before the build starts, not inside it, with
      # the program and gate the sweep uses. The runtime creates the branch
      # before the agent session runs and pushes unconditionally, so a build
      # that stops partway still leaves a branch and a pull request behind.
      # Stopping here leaves neither.
      #
      # The verdict decides, not the session: a crashed session must not end
      # the job before the gate fails it closed.
      - name: Review the issue
        if: steps.program.outputs.issue_num != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MINION_ISSUE_NUMBER: ${{ steps.program.outputs.issue_num }}
        run: |
          rm -rf "$MINION_REVIEW_DIR"
          mkdir -p "$MINION_REVIEW_DIR"
          minions run .minions/programs/review.md --issue "${{ steps.program.outputs.issue_num }}"

      # The gate acts on the verdict and writes two outputs. blocked is true
      # after a close: the gate's comment explains it, and nothing below
      # runs. changed is true after a rewrite: the old slice plan describes
      # the old text, so research runs again. No verdict exits 1 and fails
      # the job, and the failure step marks the issue.
      - name: Review gate
        id: gate
        if: steps.program.outputs.issue_num != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          go run ./cmd/minion-review gate --mode build \
            --issue "${{ steps.program.outputs.issue_num }}" \
            --verdict "$MINION_REVIEW_DIR/verdict.json"

      # A slice plan is the contract between research and the build. The
      # runtime reads the latest comment that carries the marker and builds
      # one slice per session; when no comment carries it, the build falls
      # back to a single unplanned session without a word on the issue
      # (internal/executor/slice.go, resolveSlicePlan). Detect the plan with
      # the pattern the runtime itself uses, so the two never disagree.
      #
      # A rewrite voids the plan the issue carries. The step then records
      # the time, after the rewrite, so the confirmation below accepts only a
      # plan that research publishes from now on.
      - name: Look for a slice plan
        id: slices
        if: steps.program.outputs.issue_num != '' && steps.gate.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ steps.program.outputs.issue_num }}"
          REPO="${{ github.repository }}"

          if [ "${{ steps.gate.outputs.changed }}" = "true" ]; then
            echo "::notice::The review rewrote #${ISSUE_NUM}; its old slice plan no longer counts, so research runs again."
            echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif gh issue view "$ISSUE_NUM" --repo "$REPO" --json comments \
              --jq '.comments[].body' | grep -qE "$SLICE_PLAN_MARKER"; then
            echo "::notice::#${ISSUE_NUM} carries a slice plan; research is not needed."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::#${ISSUE_NUM} carries no slice plan; research runs first."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # An approved issue with no slice plan has never been researched, and a
      # rewritten one has lost its plan. Research it here, in this run, so the
      # build works from a PRD and a slice plan instead of one unplanned
      # session. research.md runs its own premise check and posts the PRD
      # comment, the slice comment and the minion-research-completed label.
      - name: Run research
        if: steps.slices.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MINION_ISSUE_NUMBER: ${{ steps.program.outputs.issue_num }}
        run: |
          minions run .minions/programs/research.md --issue "${{ steps.program.outputs.issue_num }}"

      # research.md produces no slice plan when its own premise-checker blocks
      # the run. Without this step the build would fall back to the single
      # unplanned session that this chain exists to remove, so the plan is
      # confirmed before the build is allowed to start.
      #
      # After a rewrite only a plan published since then counts: PLAN_SINCE
      # holds the time of the rewrite, and it is empty otherwise, so every
      # comment counts. GitHub writes createdAt in the same UTC form, so the
      # strings compare in time order.
      - name: Confirm research produced a slice plan
        id: researched
        if: steps.slices.outputs.present == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PLAN_SINCE: ${{ steps.slices.outputs.since }}
        run: |
          ISSUE_NUM="${{ steps.program.outputs.issue_num }}"
          REPO="${{ github.repository }}"

          if gh issue view "$ISSUE_NUM" --repo "$REPO" --json comments \
              --jq '.comments[] | select(.createdAt >= env.PLAN_SINCE) | .body' \
              | grep -qE "$SLICE_PLAN_MARKER"; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # research.md's premise-checker applies stage-gate.md, which labels
          # the issue do-not-build. That is a block, not a failure: the gate
          # has already posted the comment that explains it.
          if gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels \
              --jq '.labels[].name' | grep -qx 'do-not-build'; then
            echo "::notice::Research blocked the premise for #${ISSUE_NUM}; skipping the build."
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Research produced no slice plan for #${ISSUE_NUM} and did not block the premise; refusing to build unplanned."
          exit 1

      - name: Run program
        if: steps.gate.outputs.blocked != 'true' && steps.researched.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ARGS="run ${{ steps.program.outputs.path }}"
          if [ -n "${{ steps.program.outputs.issue_num }}" ]; then
            ARGS="${ARGS} --issue ${{ steps.program.outputs.issue_num }}"
          fi
          if [ "${{ steps.program.outputs.dry_run }}" = "true" ]; then
            ARGS="${ARGS} --dry-run"
          fi
          minions $ARGS

      # A blocked run is not a completion and not a failure. Either gate can
      # block it: the review gate above, with a close, or research's own
      # premise-checker. Both of the steps below are skipped so the blocking
      # gate's comment stays the only account of what happened, and the
      # issue is neither closed nor marked failed.
      - name: Mark done
        if: success() && steps.program.outputs.issue_num != '' && steps.gate.outputs.blocked != 'true' && steps.researched.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ steps.program.outputs.issue_num }}"
          REPO="${{ github.repository }}"

          # Find the PR this run opened. The branch name is deterministic per
          # issue, so we can locate the PR without the agent reporting it.
          PR=$(gh pr list --repo "$REPO" \
            --head "minion/implement-implement-${ISSUE_NUM}" \
            --state open --json number --jq '.[0].number // empty')

          # A "successful" run that produced no PR is a silent failure, not a
          # completion. Fail red instead of closing the issue with no work done.
          if [ -z "$PR" ]; then
            echo "::error::Program succeeded but no PR exists for #${ISSUE_NUM}; refusing to mark done."
            exit 1
          fi

          # Keep the PR and issue linked. implement.md asks the agent to add a
          # "Closes #N" reference but it does not do so reliably, so enforce it.
          if ! gh pr view "$PR" --repo "$REPO" --json body --jq '.body' \
              | grep -qE "#${ISSUE_NUM}([^0-9]|$)"; then
            BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq '.body')
            gh pr edit "$PR" --repo "$REPO" --body "${BODY}"$'\n\n'"Closes #${ISSUE_NUM}"
          fi

          gh issue edit "$ISSUE_NUM" --repo "$REPO" \
            --add-label "minion-done" --remove-label "minion-executing"
          gh issue close "$ISSUE_NUM" --repo "$REPO" \
            --comment "Minion completed — see PR #${PR}."

      - name: Mark failed
        if: failure() && steps.program.outputs.issue_num != '' && steps.gate.outputs.blocked != 'true' && steps.researched.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUM="${{ steps.program.outputs.issue_num }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue edit "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --add-label "minion-failed" --remove-label "minion-executing"
          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --body "Minion execution failed. [View logs](${RUN_URL})"
