version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
  settings:
    errcheck:
      check-blank: true
  exclusions:
    rules:
      # Tests may blank-discard errors (cleanup noise); the source match
      # keeps errcheck's plain unchecked-call rule active in tests.
      - path: _test\.go
        linters:
          - errcheck
        source: '(^|[ \t,(])_(\s*[,=]|\s*:=)'
